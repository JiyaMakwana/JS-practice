<!-- // 1️⃣ Smart Calculator with Validation
// Problem Statement:
// •	Take two numbers using prompt().
// •	If input is not a number or empty, show an error.
// •	Ask the user to choose an operation.
// •	Handle division by zero properly.
// •	Display result using alert().
// Focus: validation, edge cases -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="calculator.css">
</head>
<body class="bg-light bg-gradient min-vh-100 overflow-hidden">
    <div class="mt-5 w-100 container h-auto">
        <form action="" style="width:400px;" class="bg-dark bg-gradient rounded">
            <div class="row p-4">
            <div id="input-screen">
                <input type="text" name="input-screen" class="form-control form-control-lg " id="result-screen" readonly>
            </div>
            <div class="col-12 mt-2">
                <div id="button-col-1" class="d-flex justify-content-evenly">
                    <button type="button" id="plus-butt" class="btn btn-secondary btn-lg m-2 w-50">+</button>
                    <button type="button" id="minus-butt" class="btn btn-secondary m-2 btn-lg w-50">-</button>
                </div>
            </div>
            <div class="col-12">
                <div id="button-col-2" class="d-flex justify-content-evenly">
                    <button type="button" id="multiply-butt" class="btn btn-secondary m-2 btn-lg w-50">*</button>
                    <button type="button" id="divide-butt" class="btn btn-secondary m-2 btn-lg w-50">/</button>
                </div> 
            </div>
            <div class="col-12">
                <div id="button-col-3" class="d-flex justify-content-evenly">
                    <button type="button" class="btn btn-info m-2 btn-lg w-100" id="equal-butt">=</button>
                </div>
            </div>
        </div>
    </div>
        </form>
        
    <script src="calculator.js"></script>
</body>
</html>
